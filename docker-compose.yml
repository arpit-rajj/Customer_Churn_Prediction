version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-churn_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-churn_password}
      - POSTGRES_DB=${POSTGRES_DB:-churn_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-churn_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-churn_user}:${POSTGRES_PASSWORD:-churn_password}@db:5432/${POSTGRES_DB:-churn_db}
      - MODEL_DIR=/app/models
      - MODEL_VERSION=${MODEL_VERSION:-rf-v1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models

volumes:
  postgres_data:
